<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>DesignBridge</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">DB</span>
          <div>
            <strong>DesignBridge</strong>
            <span>蓝湖资源抓取</span>
          </div>
        </div>

        <form class="topbar-capture" id="capture-form" aria-label="抓取蓝湖设计稿">
          <label class="sr-only" for="lanhu-url">蓝湖链接</label>
          <div class="url-row">
            <input
              id="lanhu-url"
              name="lanhu-url"
              type="url"
              inputmode="url"
              autocomplete="off"
              spellcheck="false"
              placeholder="粘贴蓝湖设计稿链接"
              required
            />
            <button class="primary-button" id="capture-button" type="submit">开始抓取</button>
            <button class="secondary-button hidden" id="cancel-button" type="button">取消</button>
          </div>
          <p class="field-error hidden" id="field-error" role="alert"></p>
        </form>

        <div class="topbar-actions">
          <div class="progress-panel hidden" id="progress-panel" aria-live="polite">
            <div class="progress-copy">
              <span id="progress-message">正在连接蓝湖…</span>
              <span id="progress-value">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-bar" id="progress-bar"></div>
            </div>
          </div>
          <div class="app-status" id="app-status">
            <span class="status-dot"></span>
            <span>就绪</span>
          </div>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar" id="sidebar" aria-label="抓取记录">
          <div class="sidebar-surface" id="sidebar-surface">
            <div class="sidebar-heading">
              <span>抓取记录</span>
              <span class="history-count" id="history-count">0</span>
            </div>
            <div class="history-list" id="history-list"></div>
            <div
              class="sidebar-resize-handle"
              id="sidebar-resize-handle"
              role="separator"
              aria-label="调整抓取记录栏宽度"
              aria-orientation="vertical"
              tabindex="0"
            ></div>
          </div>
          <div class="sidebar-toggle-root" id="sidebar-toggle-root"></div>
        </aside>

        <main class="main-content">
          <section class="results-section" aria-labelledby="results-title">
            <h1 class="sr-only" id="results-title">设计稿</h1>
            <div class="empty-state" id="empty-state">
              <div class="empty-grid" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
              </div>
              <strong>暂无抓取结果</strong>
              <span>抓取完成的画板会显示在这里</span>
            </div>
            <div class="design-inspector hidden" id="design-inspector">
              <section class="inspector-canvas" aria-label="设计稿画布">
                <header class="canvas-toolbar">
                  <div class="canvas-context">
                    <strong id="canvas-title">设计稿</strong>
                    <div class="result-meta" id="result-meta"></div>
                  </div>
                  <div class="canvas-actions">
                    <div class="canvas-zoom" aria-label="画布缩放">
                      <button id="zoom-out-button" type="button" aria-label="缩小画布" title="缩小">−</button>
                      <label>
                        <input id="zoom-input" type="number" min="4" max="400" step="1" value="100" aria-label="画布缩放百分比" />
                        <span>%</span>
                      </label>
                      <button id="zoom-in-button" type="button" aria-label="放大画布" title="放大">+</button>
                    </div>
                  </div>
                </header>
                <div class="artboard-scroll" id="artboard-scroll">
                  <div class="artboard-wrap" id="artboard-wrap">
                    <img id="artboard-image" alt="" draggable="false" />
                    <div class="slice-outlines" id="slice-outlines" aria-hidden="true"></div>
                    <div class="layer-highlight hidden" id="layer-highlight" aria-hidden="true">
                      <span id="layer-highlight-size"></span>
                    </div>
                  </div>
                </div>
              </section>
              <aside class="inspector-details hidden" id="inspector-details" aria-label="图层详情">
                <div id="platform-picker-root"></div>
                <div class="layer-details" id="layer-details"></div>
                <div id="slice-export-root"></div>
              </aside>
            </div>
          </section>
        </main>
      </div>
    </div>

    <dialog class="confirm-dialog" id="delete-confirm-dialog" aria-labelledby="delete-confirm-title" tabindex="-1">
      <div class="confirm-dialog-content">
        <h2 id="delete-confirm-title">删除抓取记录</h2>
        <p id="delete-confirm-message"></p>
        <p class="confirm-dialog-error hidden" id="delete-confirm-error" role="alert"></p>
        <div class="confirm-dialog-actions">
          <button class="secondary-button" id="delete-cancel-button" type="button">取消</button>
          <button class="danger-button" id="delete-confirm-button" type="button">删除</button>
        </div>
      </div>
    </dialog>

    <div id="preview-root"></div>
  </body>
</html>
